
name: Python CI/CD

on:
  push:
    branches:
      - main
      - 'docs/**'
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_test:
        description: "Run the manual test deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_PORT: "8102"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    container: python:3.11.10-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python and commit
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"

      - name: Check required files
        run: |
          test -f README.md || { echo "ERROR: README.md not found"; exit 1; }
          test -s app.py || { echo "ERROR: app.py is missing or empty"; exit 1; }

      - name: Compile all Python files
        run: python -m compileall -q .

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    container: python:3.11.10-slim
    if: |
      (github.event_name == 'pull_request') ||
      (github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build distribution artifact
    runs-on: ubuntu-latest
    container: python:3.11.10-slim
    if: |
      (github.ref == 'refs/heads/main') ||
      (startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist and manifest
        run: |
          mkdir -p dist
          cp books.py README.md Dockerfile books.json.example dist/
          {
            echo "CI_COMMIT_SHA=$GITHUB_SHA"
            echo "CI_PIPELINE_ID=$GITHUB_RUN_ID"
            echo "FILES:"
            find dist -maxdepth 1 -type f ! -name manifest.txt -printf '%f\n' | sort
          } > dist/manifest.txt
          echo "Artifact manifest:"
          cat dist/manifest.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: books-dist-${{ github.run_id }}
          path: dist/
          retention-days: 7

  deploy_test:
    name: Manual test deployment
    runs-on: ubuntu-latest
    needs: package
    if: |
      (github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main') &&
      (inputs.deploy_test == true)
    environment:
      name: test/books
      url: https://example.com/test/books
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: books-dist-${{ github.run_id }}
          path: dist

      - name: Check deployment secret without printing it
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "ERROR: repository secret DEPLOY_TOKEN is not configured"
            exit 1
          fi
          echo "DEPLOY_TOKEN is configured; value is hidden."

      - name: Copy artifact to test environment
        run: |
          mkdir -p deploy/test/books
          cp -R dist/. deploy/test/books/

      - name: Run smoke checks
        run: |
          python --version
          python books.py --help
          python books.py --data books.json.example search-author "булгаков"

      - name: Save deployment report
        run: |
          {
            echo "Deployment environment: test/books"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run ID: $GITHUB_RUN_ID"
            echo "APP_PORT: $APP_PORT"
            echo "DEPLOY_TOKEN: configured (value hidden)"
            echo "Smoke check: --help passed"
            echo "Smoke check: author search passed"
            echo "Deployment copy: deploy/test/books"
          } > deployment.txt
          cat deployment.txt

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report-${{ github.run_id }}
          path: deployment.txt
          retention-days: 7
